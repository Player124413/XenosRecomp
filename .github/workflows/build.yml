name: Build

# Builds the recompiler on every platform and runs the self-test suite, which
# recompiles generated shaders and checks the output, including the handling of
# boolean constant registers such as b128/b129/b130 and the shader caches that are
# generated for a single graphics API.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }}${{ matrix.dxil == 'OFF' && ', Vulkan only' || '' }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dxil: "ON"
          - os: ubuntu-latest
            dxil: "ON"
          - os: macos-latest
            dxil: "ON"
          # Shader caches for Vulkan do not need DXIL at all, which is what a Vulkan only
          # port builds.
          - os: ubuntu-latest
            dxil: "OFF"

    steps:
      - name: Select the Python executable
        shell: bash
        run: |
          if command -v python >/dev/null 2>&1; then
            echo "PYTHON=python" >> "$GITHUB_ENV"
          else
            echo "PYTHON=python3" >> "$GITHUB_ENV"
          fi

      - name: Check out the recompiler
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure and build
        shell: bash
        run: |
          set -e

          echo "Building on ${RUNNER_OS:-unknown} with $(cmake --version | head -n 1)"

          # Only Windows builds load the validation library, which is what signs the shaders for
          # the driver, but the DXIL code path itself is compiled on every platform.
          CMAKE_ARGS=(-DCMAKE_POLICY_VERSION_MINIMUM=3.5)
          CMAKE_ARGS+=(-DXENOS_RECOMP_DXIL="${{ matrix.dxil }}" -DXENOS_RECOMP_SPIRV=ON)

          # The generator is picked from the machine, newest first: GitHub moved the windows-latest
          # image to Visual Studio 2026 in June 2026 ("Visual Studio 18 2026", which needs CMake 4.2
          # or newer), while windows-2022 still ships Visual Studio 2022.
          if [ "${RUNNER_OS:-unknown}" = "Windows" ]; then
            ATTEMPTS=(
              "Visual Studio 18 2026|vs"
              "Visual Studio 17 2022|vs"
              "Visual Studio 16 2019|vs"
              "Visual Studio 15 2017|vs"
              "Ninja|single"
            )
          else
            ATTEMPTS=("default|single")
          fi

          built=0

          for attempt in "${ATTEMPTS[@]}"; do
            generator="${attempt%%|*}"
            kind="${attempt##*|}"

            if [ "$kind" = "vs" ]; then
              LABEL="the '$generator' generator"
              CONFIGURE_ARGS=(-G "$generator" -A x64)
              BUILD_ARGS=(--config RelWithDebInfo)
            elif [ "$generator" = "default" ]; then
              LABEL="the default generator"
              CONFIGURE_ARGS=(-DCMAKE_BUILD_TYPE=Release)
              BUILD_ARGS=()
            else
              LABEL="the '$generator' generator"
              CONFIGURE_ARGS=(-G "$generator" -DCMAKE_BUILD_TYPE=RelWithDebInfo)
              BUILD_ARGS=()
            fi

            echo "Configuring with $LABEL..."

            rm -rf build

            set +e
            configure_output=$(cmake -B build "${CONFIGURE_ARGS[@]}" "${CMAKE_ARGS[@]}" 2>&1)
            configure_status=$?
            set -e

            echo "$configure_output"

            # The messages of CMake and of the compiler are repeated as annotations below, so
            # that a failed run shows what went wrong in the summary of the run.
            if [ "$configure_status" != "0" ]; then
              if grep -qE "Could not create named generator|could not find any instance of Visual Studio" <<< "$configure_output"; then
                echo "::warning::$LABEL is not available on this machine, trying the next one."
                continue
              fi

              while IFS= read -r line; do
                echo "::error title=Configure error::$line"
              done < <(echo "$configure_output" | grep -E "CMake Error|CMake Warning" | head -n 10)

              echo "::error title=Build failed::CMake could not configure the build on this machine."
              echo ""
              echo "The generators that are available here are:"
              cmake --help | sed -n '/^Generators/,$p' | head -n 40 || true
              exit 1
            fi

            cmake --build build "${BUILD_ARGS[@]}" --parallel 2>&1 | tee build.log
            build_status=${PIPESTATUS[0]}

            if [ "$build_status" != "0" ]; then
              while IFS= read -r line; do
                echo "::error title=Compile error::$line"
              done < <(grep -E "error|Error" build.log | head -n 10)

              echo "::error title=Build failed::Compiling XenosRecomp failed, see the log above."
              exit 1
            fi

            built=1
            break
          done

          if [ "$built" != "1" ]; then
            echo "::error title=Build failed::CMake could not configure a build on this machine (${RUNNER_OS:-unknown}, runner '${{ matrix.os }}')."
            echo ""
            echo "The generators that are available here are:"
            cmake --help | sed -n '/^Generators/,$p' | head -n 40
            exit 1
          fi

          # -print -quit stops at the first match: 'find | head' makes find die of SIGPIPE when
          # there is more than one match, which pipefail turns into a failed step.
          TOOL=$(find build -type f \( -name "XenosRecomp" -o -name "XenosRecomp.exe" \) -print -quit)

          if [ -z "$TOOL" ]; then
            echo "::error title=Build failed::XenosRecomp was not built."
            exit 1
          fi

          mkdir -p bin
          cp "$TOOL" bin/
          echo "TOOL=$GITHUB_WORKSPACE/bin/$(basename "$TOOL")" >> "$GITHUB_ENV"

          # On Windows the recompiler is linked against the DirectX shader compiler and the DXIL
          # validation library, which it loads from its own directory, so they have to be copied
          # along with it. Linux and macOS find their shared libraries through the rpath.
          find "$(dirname "$TOOL")" -maxdepth 1 -type f \( -name "*.dll" -o -name "*.so*" -o -name "*.dylib" \) \
            -exec cp {} bin/ \; || true

          chmod +x "bin/$(basename "$TOOL")" || true

          echo "Built $TOOL"

      - name: Test
        shell: bash
        run: |
          set -e
          TOOL=$(find bin -type f \( -name "XenosRecomp" -o -name "XenosRecomp.exe" \) -print -quit)

          if [ -z "$TOOL" ]; then
            echo "::error title=Test failed::XenosRecomp was not built."
            exit 1
          fi

          set +e
          $PYTHON tests/run_tests.py --tool "$TOOL" --include XenosRecomp/shader_common.h 2>&1 | tee tests.log
          TEST_STATUS=${PIPESTATUS[0]}
          set -e

          if [ "$TEST_STATUS" != "0" ]; then
            # The message of a failing test carries the output of the recompiler after a colon,
            # so both the beginning and the end of the log are repeated as annotations.
            while IFS= read -r line; do
              echo "::error title=Test failed::$line"
            done < <(head -n 30 tests.log)

            while IFS= read -r line; do
              echo "::error title=Test output::$line"
            done < <(tail -n 20 tests.log)

            echo "::error title=Test failed::The self tests of the recompiler did not pass, see the log above."
            exit 1
          fi
