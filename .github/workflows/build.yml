name: Build

# Builds the recompiler on every platform and runs the self-test suite, which
# recompiles generated shaders and checks the output, including the handling of
# boolean constant registers such as b128/b129/b130 and the shader caches that are
# generated for a single graphics API.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }}${{ matrix.dxil == 'OFF' && ', Vulkan only' || '' }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dxil: "ON"
          - os: ubuntu-latest
            dxil: "ON"
          - os: macos-latest
            dxil: "ON"
          # Shader caches for Vulkan do not need DXIL at all, which is what a Vulkan only
          # port builds.
          - os: ubuntu-latest
            dxil: "OFF"

    steps:
      - name: Select the Python executable
        shell: bash
        run: |
          if command -v python >/dev/null 2>&1; then
            echo "PYTHON=python" >> "$GITHUB_ENV"
          else
            echo "PYTHON=python3" >> "$GITHUB_ENV"
          fi

      - name: Check out the recompiler
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure and build
        shell: bash
        run: |
          set -e

          echo "Building on ${RUNNER_OS:-unknown} with $(cmake --version | head -n 1)"

          # Only Windows builds load the validation library, which is what signs the shaders for
          # the driver, but the DXIL code path itself is compiled on every platform.
          CMAKE_ARGS=(-DCMAKE_POLICY_VERSION_MINIMUM=3.5)
          CMAKE_ARGS+=(-DXENOS_RECOMP_DXIL="${{ matrix.dxil }}" -DXENOS_RECOMP_SPIRV=ON)

          # The generator follows the machine the job runs on, so that no Visual Studio generator
          # is requested on a machine without Visual Studio.
          if [ "${RUNNER_OS:-unknown}" = "Windows" ]; then
            GENERATORS=("Visual Studio 17 2022" "Visual Studio 16 2019" "Visual Studio 15 2017")
          else
            GENERATORS=("")
          fi

          built=0

          for generator in "${GENERATORS[@]}"; do
            if [ -n "$generator" ]; then
              echo "Configuring with the '$generator' generator..."
              CONFIGURE_ARGS=(-G "$generator" -A x64)
              BUILD_ARGS=(--config RelWithDebInfo)
            else
              echo "Configuring with the default generator..."
              CONFIGURE_ARGS=(-DCMAKE_BUILD_TYPE=Release)
              BUILD_ARGS=()
            fi

            rm -rf build

            if cmake -B build "${CONFIGURE_ARGS[@]}" "${CMAKE_ARGS[@]}" && cmake --build build "${BUILD_ARGS[@]}" --parallel; then
              built=1
              break
            fi
          done

          if [ "$built" != "1" ]; then
            echo "::error title=Build failed::CMake could not configure a build on this machine (${RUNNER_OS:-unknown}, runner '${{ matrix.os }}')."
            echo ""
            echo "The generators that are available here are:"
            cmake --help | sed -n '/^Generators/,$p' | head -n 40
            exit 1
          fi

          TOOL=$(find build -type f \( -name "XenosRecomp" -o -name "XenosRecomp.exe" \) | head -n 1)

          if [ -z "$TOOL" ]; then
            echo "::error title=Build failed::XenosRecomp was not built."
            exit 1
          fi

          mkdir -p bin
          cp "$TOOL" bin/
          chmod +x "bin/$(basename "$TOOL")" || true

          echo "Built $TOOL"

      - name: Test
        shell: bash
        run: |
          set -e
          TOOL=$(find bin -type f \( -name "XenosRecomp" -o -name "XenosRecomp.exe" \) | head -n 1)

          if [ -z "$TOOL" ]; then
            echo "::error title=Test failed::XenosRecomp was not built."
            exit 1
          fi

          $PYTHON tests/run_tests.py --tool "$TOOL" --include XenosRecomp/shader_common.h
