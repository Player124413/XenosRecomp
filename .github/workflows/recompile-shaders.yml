name: Recompile Shaders

# Paste a link to an archive with the game's shader files, press "Run workflow", and
# download the recompiled shader cache from the artifacts of the run.
#
# The graphics API input selects what the shaders are compiled to: "vulkan" only compiles
# SPIR-V, "d3d12" only DXIL and "both" compiles each shader twice. A cache that only holds
# SPIR-V is half the size and is the right choice for a Vulkan only port, while "d3d12" needs
# a Windows runner to sign the DXIL blobs.
#
# The build system is picked from the machine the job runs on and not from the runner input:
# GitHub moved the windows-latest image to Visual Studio 2026 in June 2026, so a workflow that
# hardcodes one Visual Studio generator fails on the other image ("could not find any instance
# of Visual Studio"). The build step tries the Visual Studio 18 2026, 17 2022, 16 2019 and
# 15 2017 generators in that order, keeps the first one that this machine has, and prints the
# generators of the machine if it has none.
#
# The workflow works with direct links to .zip/.7z/.rar files, Google Drive links,
# MediaFire links and GitHub release assets. Archives inside the archive (for example
# the shader .ar file stored inside a zip) are extracted automatically, and the shader
# archives of the game, such as shader_r.ar.00 and shader_r.arl, can be shared as they
# are, because the recompiler decompresses them while it scans them.

on:
  workflow_dispatch:
    inputs:
      shader_archive_url:
        description: "Link to the archive with the shader files (.zip, Google Drive, MediaFire, ...). The shader archives of the game, such as shader_r.ar.00 and shader_r.arl, can be shared as they are."
        required: true
        type: string
      runner:
        description: "Build machine. Any of these works; only Windows machines produce signed DXIL. The generator is picked from the machine, so windows-latest (Visual Studio 2026 since June 2026) and windows-2022 (Visual Studio 2022) both build. Use a label that exists in this repository."
        required: true
        default: windows-latest
        type: choice
        options:
          - windows-latest
          - windows-2022
          - windows-2025
          - ubuntu-latest
          - macos-latest
      graphics_api:
        description: "Graphics API to recompile the shaders for. Vulkan only compiles SPIR-V, Direct3D 12 only DXIL."
        required: true
        default: both
        type: choice
        options:
          - both
          - vulkan
          - d3d12
      game_configuration:
        description: "Game specific recompiler code to build with"
        required: true
        default: none
        type: choice
        options:
          - none
          - UNLEASHED_RECOMP
          - MARATHON_RECOMP
      shader_common_header_url:
        description: "Optional link to a custom shader_common.h (defaults to the one in this repository)"
        required: false
        default: ""
        type: string
      shader_cache_file:
        description: "File name of the generated shader cache"
        required: false
        default: "shader_cache.cpp"
        type: string
      fail_on_shader_errors:
        description: "Fail the run when shaders could not be recompiled"
        required: false
        default: true
        type: boolean
      commit_shader_cache:
        description: "Commit the shader cache to a new branch and open a pull request"
        required: false
        default: false
        type: boolean

  # Allows a game repository to run the same steps:
  #   uses: Player124413/XenosRecomp/.github/workflows/recompile-shaders.yml@main
  workflow_call:
    inputs:
      shader_archive_url:
        required: true
        type: string
      runner:
        required: false
        default: windows-latest
        type: string
      graphics_api:
        description: "Graphics API to recompile the shaders for (both, vulkan or d3d12)"
        required: false
        default: both
        type: string
      game_configuration:
        required: false
        default: none
        type: string
      shader_common_header_url:
        required: false
        default: ""
        type: string
      shader_cache_file:
        required: false
        default: "shader_cache.cpp"
        type: string
      fail_on_shader_errors:
        required: false
        default: true
        type: boolean
      commit_shader_cache:
        required: false
        default: false
        type: boolean
    outputs:
      artifact_name:
        description: "Name of the artifact that contains the shader cache"
        value: ${{ jobs.recompile.outputs.artifact_name }}
      shader_cache:
        description: "File name of the generated shader cache inside the artifact"
        value: ${{ jobs.recompile.outputs.shader_cache }}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.runner }}
  cancel-in-progress: true

jobs:
  recompile:
    runs-on: ${{ inputs.runner }}
    name: Recompile shaders

    outputs:
      artifact_name: ${{ steps.publish.outputs.artifact_name }}
      shader_cache: ${{ steps.publish.outputs.shader_cache }}

    env:
      SHADER_ARCHIVE_URL: ${{ inputs.shader_archive_url }}
      GRAPHICS_API: ${{ inputs.graphics_api }}
      GAME_CONFIGURATION: ${{ inputs.game_configuration }}
      SHADER_COMMON_HEADER_URL: ${{ inputs.shader_common_header_url }}
      SHADER_CACHE_FILE: ${{ inputs.shader_cache_file }}
      FAIL_ON_SHADER_ERRORS: ${{ inputs.fail_on_shader_errors }}

    steps:
      - name: Select the Python executable
        shell: bash
        run: |
          # The runner input is not used here, because a job can end up on a machine of another
          # platform (a self hosted runner for example) and the name of the executable follows the
          # machine that actually runs the job.
          if command -v python >/dev/null 2>&1; then
            echo "PYTHON=python" >> "$GITHUB_ENV"
          else
            echo "PYTHON=python3" >> "$GITHUB_ENV"
          fi

          echo "Using $(command -v python || command -v python3)"

      - name: Check out the recompiler
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve inputs
        shell: bash
        run: |
          set -e

          if [ -z "$SHADER_ARCHIVE_URL" ]; then
            echo "::error title=Missing archive link::No archive link was given. Paste a direct link to a .zip with the shader files into the 'shader_archive_url' input."
            exit 1
          fi

          ARTIFACT_NAME="shader-cache-$(echo "${{ inputs.runner }}" | tr -d ' -')-${{ github.run_number }}"

          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> "$GITHUB_ENV"
          echo "SHADER_CACHE_FILE=${SHADER_CACHE_FILE:-shader_cache.cpp}" >> "$GITHUB_ENV"
          echo "SHADER_DIR=$GITHUB_WORKSPACE/shader-data" >> "$GITHUB_ENV"
          echo "CACHE_PATH=$GITHUB_WORKSPACE/out/$SHADER_CACHE_FILE" >> "$GITHUB_ENV"
          echo "REPORT_PATH=$GITHUB_WORKSPACE/out/recompile-report.json" >> "$GITHUB_ENV"
          echo "FAILED_DIR=$GITHUB_WORKSPACE/out/failed-shaders" >> "$GITHUB_ENV"
          echo "LOG_PATH=$GITHUB_WORKSPACE/out/recompile.log" >> "$GITHUB_ENV"
          echo "BUILD_DEFINES=${GAME_CONFIGURATION/none/}" >> "$GITHUB_ENV"

          case "$GRAPHICS_API" in
            both)
              DXIL=ON
              SPIRV=ON
              ;;
            vulkan)
              # A Vulkan shader cache does not need DXIL at all, so the DXIL cache is left out
              # of the generated file.
              DXIL=OFF
              SPIRV=ON
              ;;
            d3d12)
              DXIL=ON
              SPIRV=OFF
              ;;
            *)
              echo "::error title=Invalid graphics API::'$GRAPHICS_API' is not supported. Use 'both', 'vulkan' or 'd3d12'."
              exit 1
              ;;
          esac

          if [ "$GRAPHICS_API" = "d3d12" ] && [ "${RUNNER_OS:-unknown}" != "Windows" ]; then
            echo "::warning title=DXIL cannot be signed::Only Windows runners can sign the generated DXIL, the driver may reject the shaders at runtime."
          fi

          echo "GRAPHICS_API=$GRAPHICS_API" >> "$GITHUB_ENV"
          echo "XENOS_RECOMP_DXIL=$DXIL" >> "$GITHUB_ENV"
          echo "XENOS_RECOMP_SPIRV=$SPIRV" >> "$GITHUB_ENV"
          echo "Recompiling for the $GRAPHICS_API graphics API (DXIL: $DXIL, SPIR-V: $SPIRV)"

      - name: Set up the compiler cache
        uses: actions/cache@v4
        with:
          path: build
          key: build-${{ inputs.runner }}-${{ inputs.game_configuration }}-${{ hashFiles('XenosRecomp/**', 'CMakeLists.txt', 'thirdparty/CMakeLists.txt') }}
          restore-keys: |
            build-${{ inputs.runner }}-${{ inputs.game_configuration }}-

      - name: Build the recompiler
        shell: bash
        run: |
          set -e

          echo "Building on ${RUNNER_OS:-unknown} with $(cmake --version | head -n 1)"

          CMAKE_ARGS=(-DCMAKE_POLICY_VERSION_MINIMUM=3.5)
          CMAKE_ARGS+=(-DXENOS_RECOMP_EXTRA_DEFINES="$BUILD_DEFINES")
          CMAKE_ARGS+=(-DXENOS_RECOMP_DXIL="$XENOS_RECOMP_DXIL" -DXENOS_RECOMP_SPIRV="$XENOS_RECOMP_SPIRV")

          # The build system is picked from the machine the job runs on, newest first. GitHub
          # moved the windows-latest image to Visual Studio 2026 in June 2026 ("Visual Studio 18
          # 2026", which needs CMake 4.2 or newer), while windows-2022 still ships Visual Studio
          # 2022, so hardcoding one of the two makes a run fail on the other image.
          if [ "${RUNNER_OS:-unknown}" = "Windows" ]; then
            ATTEMPTS=(
              "Visual Studio 18 2026|vs"
              "Visual Studio 17 2022|vs"
              "Visual Studio 16 2019|vs"
              "Visual Studio 15 2017|vs"
              "Ninja|single"
            )
          else
            ATTEMPTS=("default|single")
          fi

          built=0

          for attempt in "${ATTEMPTS[@]}"; do
            generator="${attempt%%|*}"
            kind="${attempt##*|}"

            if [ "$kind" = "vs" ]; then
              LABEL="the '$generator' generator"
              CONFIGURE_ARGS=(-G "$generator" -A x64)
              BUILD_ARGS=(--config RelWithDebInfo)
            elif [ "$generator" = "default" ]; then
              LABEL="the default generator"
              CONFIGURE_ARGS=(-DCMAKE_BUILD_TYPE=Release)
              BUILD_ARGS=()
            else
              LABEL="the '$generator' generator"
              CONFIGURE_ARGS=(-G "$generator" -DCMAKE_BUILD_TYPE=RelWithDebInfo)
              BUILD_ARGS=()
            fi

            echo "Configuring with $LABEL..."

            # A build directory that was restored from the cache may belong to another generator,
            # which CMake refuses to reuse.
            rm -rf build

            set +e
            configure_output=$(cmake -B build "${CONFIGURE_ARGS[@]}" "${CMAKE_ARGS[@]}" 2>&1)
            configure_status=$?
            set -e

            echo "$configure_output"

            # The messages of CMake and of the compiler are repeated as annotations below, so
            # that a failed run shows what went wrong in the summary of the run.
            if [ "$configure_status" != "0" ]; then
              if grep -qE "Could not create named generator|could not find any instance of Visual Studio" <<< "$configure_output"; then
                echo "::warning::$LABEL is not available on this machine, trying the next one."
                continue
              fi

              while IFS= read -r line; do
                echo "::error title=Configure error::$line"
              done < <(echo "$configure_output" | grep -E "CMake Error|CMake Warning" | head -n 10)

              echo "::error title=Build failed::CMake could not configure the build on this machine."
              echo ""
              echo "The generators that are available here are:"
              cmake --help | sed -n '/^Generators/,$p' | head -n 40 || true
              exit 1
            fi

            # GitHub runs bash with 'pipefail', so the status of the build has to be read from
            # the pipeline: a failing build would otherwise end the step before the errors are
            # repeated as annotations.
            set +e
            cmake --build build "${BUILD_ARGS[@]}" --parallel 2>&1 | tee build.log
            build_status=${PIPESTATUS[0]}
            set -e

            if [ "$build_status" != "0" ]; then
              while IFS= read -r line; do
                echo "::error title=Compile error::$line"
              done < <(grep -E "error|Error" build.log | head -n 10)

              echo "::error title=Build failed::Compiling XenosRecomp failed, see the log above."
              exit 1
            fi

            built=1
            break
          done

          if [ "$built" != "1" ]; then
            echo "::error title=Build failed::CMake could not configure a build on this machine (${RUNNER_OS:-unknown}, runner '${{ inputs.runner }}'). Pick a runner label that matches the machines of this repository, or install a compiler on it."
            echo ""
            echo "The generators that are available here are:"
            cmake --help | sed -n '/^Generators/,$p' | head -n 40 || true
            exit 1
          fi

          TOOL=$(find build -type f \( -name "XenosRecomp" -o -name "XenosRecomp.exe" \) | head -n 1)

          if [ -z "$TOOL" ]; then
            echo "::error title=Build failed::XenosRecomp was not built."
            exit 1
          fi

          mkdir -p bin
          cp "$TOOL" bin/

          # On Windows the recompiler is linked against the DirectX shader compiler and the DXIL
          # validation library, which it loads from its own directory, so they have to be copied
          # along with it. Linux and macOS find their shared libraries through the rpath.
          find "$(dirname "$TOOL")" -maxdepth 1 -type f \( -name "*.dll" -o -name "*.so*" -o -name "*.dylib" \) \
            -exec cp {} bin/ \; || true

          chmod +x "bin/$(basename "$TOOL")" || true

          echo "TOOL=$GITHUB_WORKSPACE/bin/$(basename "$TOOL")" >> "$GITHUB_ENV"
          echo "Built $TOOL"

      - name: Test the recompiler
        shell: bash
        run: |
          set +e
          $PYTHON tests/run_tests.py --tool "$TOOL" --include XenosRecomp/shader_common.h 2>&1 | tee tests.log
          TEST_STATUS=${PIPESTATUS[0]}
          set -e

          if [ "$TEST_STATUS" != "0" ]; then
            while IFS= read -r line; do
              echo "::error title=Test failed::$line"
            done < <(grep -E "FAIL|Traceback|Error|error" tests.log | head -n 10)

            echo "::error title=Test failed::The self tests of the recompiler did not pass, see the log above."
            exit 1
          fi

      - name: Download the shader archive
        shell: bash
        run: |
          set -e
          $PYTHON scripts/fetch_shader_archive.py "$SHADER_ARCHIVE_URL" "$SHADER_DIR" | tee fetch.log
          RESULT_DIR=$(grep '^RESULT_DIR=' fetch.log | tail -n 1 | cut -d= -f2-)
          echo "SHADER_EXTRACT_DIR=$RESULT_DIR" >> "$GITHUB_ENV"

      - name: Set up the shader common header
        shell: bash
        run: |
          set -e

          HEADER=XenosRecomp/shader_common.h

          if [ -n "$SHADER_COMMON_HEADER_URL" ]; then
            mkdir -p custom
            $PYTHON -c "import sys, urllib.request; urllib.request.urlretrieve(sys.argv[1], sys.argv[2])" \
              "$SHADER_COMMON_HEADER_URL" custom/shader_common.h
            HEADER=custom/shader_common.h
            echo "Using the shader common header from $SHADER_COMMON_HEADER_URL"
          fi

          echo "SHADER_COMMON_HEADER=$GITHUB_WORKSPACE/$HEADER" >> "$GITHUB_ENV"

      - name: Recompile the shaders
        id: recompile
        shell: bash
        run: |
          set -o pipefail

          mkdir -p out

          FAILURE_ARG=""
          if [ "$FAIL_ON_SHADER_ERRORS" != "true" ]; then
            FAILURE_ARG="--allow-failures"
          fi

          set +e
          "$TOOL" "$SHADER_EXTRACT_DIR" "$CACHE_PATH" "$SHADER_COMMON_HEADER" \
            --api "$GRAPHICS_API" \
            --report "$REPORT_PATH" \
            --dump-failed "$FAILED_DIR" \
            $FAILURE_ARG 2>&1 | tee "$LOG_PATH"
          STATUS=${PIPESTATUS[0]}
          set -e

          echo "exit_code=$STATUS" >> "$GITHUB_OUTPUT"

          if [ -s "$CACHE_PATH" ]; then
            echo "### Shader cache" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Generated \`$SHADER_CACHE_FILE\` for the $GRAPHICS_API graphics API ($(du -h "$CACHE_PATH" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$STATUS" != "0" ]; then
            echo "::error title=Shader recompilation failed::Some shaders could not be recompiled. See the job summary and the failed-shaders artifact for details."
          fi

          exit $STATUS

      - name: Write the job summary
        if: always()
        shell: bash
        run: |
          $PYTHON scripts/summarize_report.py "$REPORT_PATH" --log "$LOG_PATH" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the artifacts
        id: publish
        if: always()
        shell: bash
        run: |
          set -e
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          echo "shader_cache=$SHADER_CACHE_FILE" >> "$GITHUB_OUTPUT"

      - name: Upload the shader cache
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            out/${{ env.SHADER_CACHE_FILE }}
            out/recompile-report.json
            out/recompile.log
          if-no-files-found: warn

      - name: Upload the failed shaders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}-failed-shaders
          path: out/failed-shaders
          if-no-files-found: ignore

      - name: Upload the recompiler
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XenosRecomp-${{ inputs.runner }}-${{ inputs.game_configuration }}
          path: bin
          if-no-files-found: warn

      - name: Commit the shader cache
        if: ${{ always() && inputs.commit_shader_cache == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          if [ ! -s "$CACHE_PATH" ]; then
            echo "::warning title=Nothing to commit::The shader cache is empty, skipping the commit."
            exit 0
          fi

          BRANCH="shader-cache/run-${{ github.run_id }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p shader-cache
          cp "$CACHE_PATH" "shader-cache/$SHADER_CACHE_FILE"

          if [ -f "$REPORT_PATH" ]; then
            cp "$REPORT_PATH" shader-cache/recompile-report.json
          fi

          git checkout -b "$BRANCH"
          git add shader-cache
          git commit -m "Recompile shaders (${SHADER_ARCHIVE_URL})" || {
            echo "Nothing changed, skipping."
            exit 0
          }
          git push origin "$BRANCH"

          gh pr create --title "Recompiled shader cache" \
            --body "Shader cache generated by the \`Recompile Shaders\` workflow from ${SHADER_ARCHIVE_URL}." \
            --head "$BRANCH" \
            --base "${{ github.ref_name }}" \
            || echo "::warning title=No pull request::The branch was pushed, but a pull request could not be created (GitHub Actions may not be allowed to create pull requests for this repository). Open one manually from the $BRANCH branch."
